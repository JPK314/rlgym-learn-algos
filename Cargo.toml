[package]
name = "rlgym-learn-algos"
version = "0.4.2"
edition = "2021"
description = "Rust backend for the more expensive parts of the rlgym-learn-algos python module"
license="Apache-2.0"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "rlgym_learn_algos"
crate-type = ["cdylib"]

[dependencies]
numpy = "0.29.0"
pyo3 = { version = "0.29.0", features = ["py-clone"] }
paste = { package = "pastey", version = "*" }
itertools = "0.14.0"
enum-kinds = "0.5.1"
rand = "0.10.2"
